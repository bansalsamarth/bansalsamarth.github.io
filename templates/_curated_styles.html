{# Shared styles for the curated listings on the essays and journalism pages.
   Kept out of base.html so the CSS only ships on the two pages that use it. #}
<style>
    .curated-intro {
        color: var(--text-secondary);
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 3rem;
    }

    .curated-item {
        margin: 2.5rem 0;
        padding-bottom: 2.25rem;
        border-bottom: 1px solid var(--border-light);
    }

    .curated-item:last-child {
        border-bottom: none;
    }

    .curated-meta {
        display: flex;
        gap: 0.75rem;
        align-items: baseline;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
    }

    .curated-publication {
        color: var(--link-color);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.8rem;
    }

    .curated-date {
        color: var(--date-color);
        font-feature-settings: "tnum";
    }

    .curated-title {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 0.6rem;
    }

    .curated-title a {
        color: var(--text-primary);
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .curated-title a:hover {
        color: var(--link-color);
    }

    .curated-note {
        font-size: 0.98rem;
        line-height: 1.65;
        color: var(--text-secondary);
    }

    .curated-note p {
        margin: 0.6em 0;
    }

    .curated-note p:first-child {
        margin-top: 0;
    }

    .curated-note p:last-child {
        margin-bottom: 0;
    }
</style>
