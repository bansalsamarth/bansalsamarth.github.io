name: Build and deploy site

# Safety net: rebuilds the site whenever content is pushed, so the live site
# never lags behind the markdown — even for edits made on github.com or a phone.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    # Skip runs triggered by this workflow's own commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python generator.py build

      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Site already up to date."
          else
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
